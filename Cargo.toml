[workspace]
members = ["htmxology", "htmxology-macros", "tests/hygiene"]
#default-members = ["htmxology"]
resolver = "2"

[workspace.package]
version = "0.29.0"
edition = "2024"
authors = ["Julien Kauffmann"]
repository = "https://github.com/ereOn/htmxology.rs"
license = "MIT"

[workspace.dependencies]
htmxology = { path = "./htmxology" }
htmxology-macros = { path = "./htmxology-macros", version = "0.29.0" }

anyhow = "1"
askama = { version = "0.16" }
axum = { version = "0.8", features = ["tokio"]}
axum-extra = { version = "0.12", features = ["form"] }
convert_case = "0.12"
itertools = "0.15"
listenfd = "1"
hex = "0.4"
http = "1"
md-5 = "0.10"
netdev = "0.46"
proc-macro2 = "1"
quote = "1"
percent-encoding = "2"
regex = "1"
serde = { version ="1", features = ["derive"] }
serde_json = "1"
serde_html_form = "0.4"
syn = { version = "3", features = ["full"] }
thiserror = "2"
insta = { version = "1", features = ["yaml"] }
prettyplease = "0.3"
tokio = { version = "1", features = ["macros"] }
tower = { version = "0.5", features = ["util"] }
tower-layer = "0.3"
tower-service = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3" }
scraper = "0.29"
